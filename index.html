<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記事一覧 - My Articles</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="header__title">My Articles</h1>
            <p class="header__subtitle">記事一覧</p>
        </div>
    </header>

    <main class="container">
        <!-- フィルター -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="技術">技術</button>
            <button class="filter-btn" data-filter="考察">考察</button>
            <button class="filter-btn" data-filter="チュートリアル">チュートリアル</button>
        </div>

        <!-- 表示形式の切り替え -->
        <div class="view-switcher">
            <button class="view-btn active" data-view="grid" title="グリッド表示">
                <span>⊞</span> グリッド
            </button>
            <button class="view-btn" data-view="list" title="リスト表示">
                <span>≡</span> リスト
            </button>
        </div>

        <!-- 記事リスト -->
        <section class="articles" id="articles-container">
            <!-- JavaScriptで動的に生成されます -->
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 My Articles. All rights reserved.</p>
        </div>
    </footer>

    <script src="src/script.js"></script>
</body>
</html>
